<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>圆角支持检测</title>
<style>
  body{margin:0;padding:28px;font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif;background:#f5f7fa;color:#222}
  h1{font-size:20px;margin:0 0 6px}
  .row{display:flex;gap:26px;margin:18px 0 26px}
  .box{width:200px;height:200px;border-radius:56px;background:#1d2430;position:relative}
  .sq{corner-shape:squircle}
  .cap{position:absolute;left:0;bottom:-26px;font-size:13px;color:#555}
  .verdict{font-size:17px;font-weight:700;padding:12px 16px;border-radius:10px;display:inline-block}
  .yes{background:#e6f7ea;color:#0a7a2f;border:1px solid #9ad8ab}
  .no{background:#fdeaea;color:#a31212;border:1px solid #f0a9a9}
  code{background:#eee;padding:1px 6px;border-radius:5px}
</style></head>
<body>
  <h1>圆角曲率支持检测</h1>
  <p>这个页面用来判断：<b>你当前这个浏览器</b>是否支持 <code>corner-shape: squircle</code>（连续曲率圆角）。</p>
  <p id="verdict" class="verdict">检测中…</p>
  <p id="ua" style="color:#666;font-size:13px"></p>
  <div class="row">
    <div class="box"><span class="cap">圆弧（传统 border-radius）</span></div>
    <div class="box sq"><span class="cap">squircle（连续曲率）</span></div>
  </div>
  <p>如果左右两个方块的<strong>肩部弧度看不出区别</strong>，说明本浏览器不支持，右边会被当作普通圆弧渲染。</p>
  <script>
    var ok = false;
    try { ok = CSS.supports('corner-shape', 'squircle'); } catch (e) { ok = false; }
    var v = document.getElementById('verdict');
    v.className = 'verdict ' + (ok ? 'yes' : 'no');
    v.textContent = ok ? '✅ 支持 corner-shape：应用里的连续曲率对你是生效的' : '❌ 不支持 corner-shape：应用里所有圆角都会退回普通圆弧';
    document.getElementById('ua').textContent = '浏览器：' + navigator.userAgent;
  </script>
</body></html>
