<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      声明页面同时支持浅色与深色。不写这一行时，Android Chrome 等浏览器在系统深色下会启用
      「自动深色 / 强制反色」，把手动切换时正常的配色反成发灰的一团；声明后观感完全由我们的
      html.dark 一套变量决定，系统跟随与手动切换表现一致。
    -->
    <meta name="color-scheme" content="light dark" />
    <!-- 手机浏览器地址栏 / 状态栏的配色：初始给亮色，应用启动后由 useTheme 按当前主题改写 -->
    <meta name="theme-color" content="#f5f7fa" />
    <!--
      中文字体 MiSans（小米开源，遵循 MiSans 字体许可）。用「中文网字计划」的分包方案：
      每个字重一份 CSS，内部按 unicode-range 切成上百个小 woff2，浏览器只下载页面用到的字块。
      只加载 regular(400) 与 semibold(600)；其余字重由浏览器就近匹配。
      国内用 bootcdn；国际线路可换 https://cdn.jsdelivr.net/npm/misans-webfont/misans/misans-regular/result.css
      离线/内网拿不到 CDN 时，会静默回落到 --qt-font-sans 里的系统字体栈。
    -->
    <link rel="preconnect" href="https://cdn.bootcdn.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.bootcdn.net/ajax/libs/misans-webfont/4.3.1/misans/misans-regular/result.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.bootcdn.net/ajax/libs/misans-webfont/4.3.1/misans/misans-semibold/result.css"
    />

    <!-- 站点标题仅作首屏兜底：应用启动后由 src/utils/constants.js 的 APP_INFO.name 覆盖 -->
    <title>青兔在线工具箱</title>
    <!--
      P5.33 定稿 logo（A1）：Lucide rabbit + 得意黑。
      主图标用 public/favicon.svg：Lucide rabbit 的 16px 像素对齐几何 + 强调色圆角贴片。
      贴片而不是单色墨，是因为 <img> 里的 SVG 媒体查询在 Chrome 不生效（实测见 devtools/p533-brand），
      单色版会在深色标签栏上消失；iOS 添加主屏不支持 SVG，另给一张 180×180 PNG。
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
</head>
  <body>
    <!-- Vue 应用挂载点 -->
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
